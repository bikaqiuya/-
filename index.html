<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香辛料标准信息查询系统</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    <style>
        :root {
            --primary: #2c7a7b;
            --primary-light: #4fd1d9;
            --primary-hover: #285e61;
            --secondary: #f0fdfa;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --success: #48bb78;
            --warning: #ed8936;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e6fffa 0%, #f7fafc 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px 30px;
            animation: fadeInDown 0.6s ease-out;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        header .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Search Section */
        .search-section {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            animation: fadeInUp 0.6s ease-out 0.1s backwards;
        }

        .search-input-wrapper {
            flex: 1;
            min-width: 280px;
            max-width: 500px;
            position: relative;
        }

        .search-input-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        .search-section input {
            width: 100%;
            padding: 14px 14px 14px 42px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            background: var(--bg);
        }

        .search-section input:focus {
            outline: none;
            border-color: var(--primary-light);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(44, 122, 123, 0.1);
        }

        .search-section button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--primary);
            border: 1px solid var(--primary-light) !important;
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        /* Stats */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--card-bg);
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            animation: fadeInUp 0.6s ease-out 0.2s backwards;
        }

        .stats-bar .count {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
        }

        /* Table */
        .table-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out 0.3s backwards;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 65vh;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 16px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        th:first-child { border-radius: 0; }
        th:last-child { border-radius: 0; }

        td {
            padding: 14px;
            border-bottom: 1px solid var(--border);
            font-size: 0.92rem;
            line-height: 1.5;
            vertical-align: middle;
        }

        tbody tr {
            transition: all 0.15s;
        }

        tbody tr:hover {
            background: var(--secondary);
            transform: scale(1.002);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .spice-name {
            font-weight: 700;
            color: var(--primary);
            font-size: 1rem;
        }

        .botanical {
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: 'Georgia', serif;
        }

        .part-tag {
            display: inline-block;
            background: #edf2f7;
            color: #4a5568;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .std-12729 {
            background: #ebf4ff;
            color: #3182ce;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 4px;
        }

        .std-21725 {
            background: #f0fff4;
            color: #38a169;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: inline-block;
        }

        .std-s1 { background: #faf5ff; color: #805ad5; }
        .std-p1 { background: #fffaf0; color: #dd6b20; }
        .std-d1 { background: #f0fff4; color: #38a169; }

        /* Loading & Empty */
        .loading-state, .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .loading-state .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            color: var(--border);
            margin-bottom: 16px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.8;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 { font-size: 1.6rem; }
            .search-section { flex-direction: column; }
            .search-section input { max-width: 100%; }
            .search-section button { width: 100%; justify-content: center; }
            .stats-bar { flex-direction: column; gap: 8px; text-align: center; }
            th, td { padding: 10px 8px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span>🌿</span>
                香辛料标准信息查询
            </h1>
            <p class="subtitle">基于国家标准 GB/T 12729.1-2008 与 GB/T 21725-2017 构建的香辛料数据库，支持跨标准联合检索</p>
        </header>

        <div class="search-section">
            <div class="search-input-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="输入香辛料名称或学名，如：八角、Illicium、花椒..." autocomplete="off" />
            </div>
            <button class="btn-primary" onclick="handleSearch()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                查询
            </button>
            <button class="btn-secondary" onclick="showAll()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <polyline points="3 3 3 8 8 8"></polyline>
                </svg>
                显示全部
            </button>
        </div>

        <div class="stats-bar">
            <div>共 <span class="count" id="totalCount">-</span> 种香辛料</div>
            <div>当前显示 <span class="count" id="filteredCount" style="color: var(--warning);">-</span> 条结果</div>
        </div>

        <div class="table-container">
            <div class="table-wrapper">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th>中文名称</th>
                            <th>植物学名</th>
                            <th>使用部位</th>
                            <th>GB/T 12729.1-2008</th>
                            <th>GB/T 21725-2017 分类</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="5">
                                <div class="loading-state">
                                    <div class="spinner"></div>
                                    <p>正在从 KV 加载数据...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <footer>
            <p>数据来源：GB/T 12729.1-2008《香辛料和调味品 名称》及 GB/T 21725-2017《天然香辛料 分类》</p>
            <p>© 2026 香辛料标准查询系统 | 部署于 EdgeOne Pages | <a href="/admin.html">管理后台</a></p>
        </footer>
    </div>

    <script>
        const API_URL = '/api/spices';
        let allSpices = [];
        let isLoading = false;

        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const totalCountEl = document.getElementById('totalCount');
        const filteredCountEl = document.getElementById('filteredCount');

        // 页面加载时获取数据
        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
            // 回车键查询
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch();
            });
            // 输入时实时过滤（防抖）
            let debounceTimer;
            searchInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    if (allSpices.length > 0) handleSearch();
                }, 300);
            });
        });

        // 从 API 获取数据
        async function fetchData() {
            if (isLoading) return;
            isLoading = true;
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                allSpices = await response.json();
                totalCountEl.textContent = allSpices.length;
                renderTable(allSpices);
            } catch (error) {
                console.error('数据加载失败:', error);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="8" x2="12" y2="12"></line>
                                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                                </svg>
                                <p>数据加载失败，请检查 API 配置或稍后重试</p>
                                <p style="font-size:0.85rem;margin-top:8px;">${error.message}</p>
                            </div>
                        </td>
                    </tr>
                `;
                totalCountEl.textContent = '0';
                filteredCountEl.textContent = '0';
            } finally {
                isLoading = false;
            }
        }

        // 渲染表格
        function renderTable(data) {
            filteredCountEl.textContent = data.length;
            if (data.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 12A10 10 0 1 1 12 2v10z"></path>
                                </svg>
                                <p>未找到匹配的香辛料，请尝试其他关键词</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = data.map(item => {
                // 根据分类添加不同样式
                let std21725Class = '';
                if (item.std21725 && item.std21725.includes('浓香')) std21725Class = 'std-s1';
                else if (item.std21725 && item.std21725.includes('辛辣')) std21725Class = 'std-p1';
                else if (item.std21725 && item.std21725.includes('淡香')) std21725Class = 'std-d1';

                return `
                    <tr>
                        <td><span class="spice-name">${escapeHtml(item.name)}</span></td>
                        <td><span class="botanical">${escapeHtml(item.botanical || '—')}</span></td>
                        <td><span class="part-tag">${escapeHtml(item.part || '—')}</span></td>
                        <td><span class="std-12729">${escapeHtml(item.std12729 || '表1收录')}</span></td>
                        <td><span class="std-21725 ${std21725Class}">${escapeHtml(item.std21725 || '未单列')}</span></td>
                    </tr>
                `;
            }).join('');
        }

        // 查询处理
        function handleSearch() {
            const keyword = searchInput.value.trim().toLowerCase();
            if (!keyword) {
                renderTable(allSpices);
                return;
            }
            const filtered = allSpices.filter(item =>
                (item.name && item.name.toLowerCase().includes(keyword)) ||
                (item.botanical && item.botanical.toLowerCase().includes(keyword)) ||
                (item.part && item.part.toLowerCase().includes(keyword)) ||
                (item.std21725 && item.std21725.toLowerCase().includes(keyword))
            );
            renderTable(filtered);
        }

        // 显示全部
        function showAll() {
            searchInput.value = '';
            renderTable(allSpices);
        }

        // HTML 转义防 XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
